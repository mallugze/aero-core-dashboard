services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aerocore_web
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
volumes:
  sqlite_data:
